apiVersion: v1
kind: Service
metadata:
  name: {{ include "ride-connect.fullname" . }}
  labels:
    {{- include "ride-connect.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ride-connect.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
